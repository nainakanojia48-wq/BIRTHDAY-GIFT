<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>

    <!-- CSS -->
     <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>💖</span>
        <span>💕</span>
        <span>💗</span>
        <span>❤️</span>
        <span>💞</span>
        <span>💖</span>
        <span>💕</span>
        <span>💗</span>
    </div>

    <!-- Login Card -->
    <div class="container">

        <h1>🎂 Happy Birthday</h1>

        <h2>A Little Surprise<br>Made Especially For You ❤️</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter Your Beautiful Name..."
        >

        <button onclick="checkName()">
            ✨ Unlock Surprise
        </button>

        <p id="message"></p>

        <small>
            Some surprises are worth unlocking ❤️
        </small>

    </div>

<script src="birthday.js"></script>

</body>
</html>
